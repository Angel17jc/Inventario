name: Keep Supabase development project active

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Para volver a activarse a sí mismo y que GitHub no lo apague (último paso).
  actions: write

jobs:
  database-activity:
    runs-on: ubuntu-latest
    steps:
      # A free Supabase project pauses after seven days without activity, and
      # this is the only thing keeping it awake while the app has no real
      # traffic yet.
      #
      # What went wrong before, so it is not tried again: this used to read a
      # table with the publishable key, get 42501 "permission denied" back, and
      # call that a success on the theory that a refused query is still a query
      # Postgres ran. Supabase did not count it. The job reported success every
      # day from 9 to 15 September 2026, and on the 16th — seven days after the
      # last real use — the project was paused and its hostname stopped
      # resolving. A keepalive that says "fine" while the project goes to sleep
      # is worse than none: it is why nobody looked.
      #
      # So two rules now. Ask Supabase directly whether the project is up, and
      # say so in plain words if it is not. And only report success on a real
      # write that answered 200 — never on an error, however it is reasoned.

      - name: The project is not paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::No SUPABASE_ACCESS_TOKEN secret; cannot ask Supabase for the project status."
            exit 0
          fi
          STATUS=$(curl --silent --show-error --retry 3 --retry-all-errors \
            "https://api.supabase.com/v1/projects/htkzkykfmnybkqcrtkby" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).status||'desconocido')}catch{console.log('desconocido')}})")
          echo "Estado del proyecto: $STATUS"
          case "$STATUS" in
            ACTIVE_HEALTHY) ;;
            INACTIVE|PAUSED|PAUSING)
              echo "::error::El proyecto de Supabase está PAUSADO. Los datos siguen ahí, pero la app no funciona."
              echo "::error::Restáuralo en https://supabase.com/dashboard/project/htkzkykfmnybkqcrtkby"
              exit 1 ;;
            *)
              echo "::warning::Estado inesperado: $STATUS. Se intenta el latido de todos modos." ;;
          esac

      - name: A real write, answered with 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing the SUPABASE_URL secret."; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing the SUPABASE_ANON_KEY secret."; exit 1; }

          # heartbeat_beat() updates one row that holds nothing belonging to any
          # shop, and is the only function the publishable key may execute.
          CODE=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output respuesta.json --write-out '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/heartbeat_beat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}') || CODE="000"

          echo "HTTP $CODE"
          cat respuesta.json 2>/dev/null || true
          echo

          if [ "$CODE" = "200" ] && grep -qE '"?20[0-9]{2}-' respuesta.json; then
            echo "Latido registrado. El proyecto tuvo actividad real hoy."
            exit 0
          fi
          echo "::error::El latido no se registró (HTTP $CODE). El proyecto NO tuvo actividad hoy."
          echo "::error::Si esto se repite siete días, Supabase lo pausará."
          exit 1

      # GitHub apaga los workflows programados de un repo PÚBLICO tras 60 días
      # sin commits. Si pasara, este dejaría de correr, nadie lo notaría y el
      # proyecto se pausaría otra vez — el mismo incidente por otra puerta.
      # Volver a activarlo reinicia ese contador; sobre uno activo no cambia nada.
      - name: Stay enabled past GitHub's 60-day rule
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" \
            && echo "Workflow reactivado: el contador de 60 días empieza de nuevo."

      # SUPABASE_ACCESS_TOKEN vence a los 90 días y no hay forma de preguntarle
      # su propia fecha. Se guarda en la variable de repositorio
      # SUPABASE_TOKEN_EXPIRES (AAAA-MM-DD) y aquí se vigila. Al renovar el token,
      # actualizar la variable: gh variable set SUPABASE_TOKEN_EXPIRES --body AAAA-MM-DD
      # Va el último y con always(): un aviso sobre el token no debe impedir el latido.
      - name: The Supabase token is not about to expire
        if: always()
        env:
          EXPIRA: ${{ vars.SUPABASE_TOKEN_EXPIRES }}
        run: |
          if [ -z "$EXPIRA" ]; then
            echo "::warning::Falta la variable SUPABASE_TOKEN_EXPIRES: no se sabe cuándo vence el token."
            exit 0
          fi
          DIAS=$(( ( $(date -u -d "$EXPIRA" +%s) - $(date -u +%s) ) / 86400 ))
          echo "El token de Supabase vence el $EXPIRA: quedan $DIAS días."
          RENOVAR="Renuévalo en Supabase → Account → Access Tokens (alcance Project, solo lectura de Project Settings y Database, NUNCA API Keys), pégalo en el secreto SUPABASE_ACCESS_TOKEN y actualiza la variable SUPABASE_TOKEN_EXPIRES."
          if [ "$DIAS" -le 0 ]; then
            echo "::error::El token de Supabase VENCIÓ el $EXPIRA. $RENOVAR"
            exit 1
          elif [ "$DIAS" -le 7 ]; then
            echo "::error::El token de Supabase vence en $DIAS días ($EXPIRA). $RENOVAR"
            exit 1
          elif [ "$DIAS" -le 14 ]; then
            echo "::warning::El token de Supabase vence en $DIAS días ($EXPIRA). $RENOVAR"
          fi
